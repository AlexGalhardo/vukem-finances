name: Fuzz

# Every Go fuzz target (`go run ./scripts/qa/fuzz-targets`) runs for 30 seconds on a
# pull request that touches a parser or a protocol, and for 10 minutes every night.
# A crash input is uploaded as an artifact: commit it under testdata/fuzz/<Target>/
# of its package as a regression seed, then fix the code.

on:
  pull_request:
    branches: [main]
    paths:
      - "app/finance/**"
      - "app/telegram/**"
      - "app/changes/**"
      - "app/sync/**"
      - "app/mcp/**"
      - "app/oauth/**"
      - "app/ai/**"
      - "tests/fuzz_*_test.go"
      - "tests/testdata/fuzz/**"
      - "scripts/qa/fuzz-targets/**"
      - ".github/workflows/fuzz.yml"
      - "go.mod"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "How long each target runs (a Go duration, for example 2m)"
        default: "30s"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - id: list
        run: |
          list=$(go run ./scripts/qa/fuzz-targets -packages | jq -R -s -c 'split("\n")[:-1] | map(split(" ") | {name: .[0], pkg: .[1]})')
          test "$list" != "[]"
          echo "matrix=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '10m' || (github.event.inputs.fuzztime || '30s') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # go test -fuzz refuses a pattern that matches several packages: one target, one package.
      - name: Fuzz ${{ matrix.target.name }}
        run: go test -run='^$' -fuzz='^${{ matrix.target.name }}$' -fuzztime="$FUZZTIME" -timeout=0 ${{ matrix.target.pkg }}
      - name: Keep the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target.name }}
          path: ${{ matrix.target.pkg }}/testdata/fuzz/${{ matrix.target.name }}/
          if-no-files-found: warn
