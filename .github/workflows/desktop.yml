name: Desktop

# A published release (or a manual dispatch) builds the desktop app for Windows,
# macOS and Linux, runs the headless smoke test on each and, for a release,
# uploads the installers to it. A pull request that touches the desktop code
# builds without publishing. The builds are unsigned (docs/desktop.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to link into the build (for example 0.1.0)
        required: false
        default: 0.0.0-dev
  pull_request:
    branches: [main]
    paths:
      - desktop/**
      - app/desktopgate/**
      - bootstrap/desktop.go
      - .github/workflows/desktop.yml
      - go.mod
      - go.sum

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux stays on 24.04: GTK 4.22 of 26.04 has no gtk-4.0 module folder, which
        # the AppImage GTK plugin requires, and an older glibc runs on more systems.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Linux system packages (GTK 4 and WebKitGTK 6.0)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: NSIS (Windows installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis --version=3.13.0 --yes --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Install wails3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ github.event.inputs.version }}
        run: |
          case "$EVENT" in
            release) v="${TAG#v}" ;;
            workflow_dispatch) v="${INPUT:-0.0.0-dev}" ;;
            *) v="0.0.0-dev" ;;
          esac
          case "$v" in *[!0-9A-Za-z.-]* | "") echo "bad version: $v" >&2; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The tests render real pages, which need the gitignored Vite manifest.
      - name: Build the web assets
        shell: bash
        run: bun install --frozen-lockfile && bun run build

      - name: Test the desktop module
        shell: bash
        working-directory: desktop
        run: go test ./... -count=1

      - name: Package
        shell: bash
        working-directory: desktop
        run: wails3 package VERSION="${{ steps.version.outputs.version }}"

      - name: Smoke test (headless)
        shell: bash
        run: |
          bin="desktop/bin/vukem-finances"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          bash desktop/scripts/smoke.sh "$bin"

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist
          cd desktop/bin
          case "$RUNNER_OS" in
            Windows) cp ./*-setup.exe ./*-portable.exe ../../dist/ ;;
            macOS) cp ./*-macos-*.zip ../../dist/ ;;
            Linux) cp ./*.deb ./*.AppImage ../../dist/ ;;
          esac
          ls -l ../../dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Upload to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --repo "$REPO" --clobber
