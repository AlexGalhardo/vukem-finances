name: Desktop

# A published release (or a manual dispatch) builds the desktop app for Windows,
# macOS and Linux, runs the headless smoke test on each and, for a release,
# uploads the installers to it. A pull request that touches the desktop code
# builds without publishing. The builds are unsigned (docs/desktop.md). The
# Windows job also builds, test-signs, installs and uninstalls an MSIX on every
# run; the `store` job submits it to the Microsoft Store, opt-in.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to link into the build (for example 0.1.0)
        required: false
        default: 0.0.0-dev
  pull_request:
    branches: [main]
    paths:
      - desktop/**
      - app/desktopgate/**
      - bootstrap/desktop.go
      - .github/workflows/desktop.yml
      - go.mod
      - go.sum

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux stays on 24.04: GTK 4.22 of 26.04 has no gtk-4.0 module folder, which
        # the AppImage GTK plugin requires, and an older glibc runs on more systems.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Linux system packages (GTK 4 and WebKitGTK 6.0)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: NSIS (Windows installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis --version=3.13.0 --yes --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Install wails3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ github.event.inputs.version }}
        run: |
          case "$EVENT" in
            release) v="${TAG#v}" ;;
            workflow_dispatch) v="${INPUT:-0.0.0-dev}" ;;
            *) v="0.0.0-dev" ;;
          esac
          case "$v" in *[!0-9A-Za-z.-]* | "") echo "bad version: $v" >&2; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The tests render real pages, which need the gitignored Vite manifest.
      - name: Build the web assets
        shell: bash
        run: bun install --frozen-lockfile && bun run build

      - name: Test the desktop module
        shell: bash
        working-directory: desktop
        run: go test ./... -count=1

      - name: Package
        shell: bash
        working-directory: desktop
        run: wails3 package VERSION="${{ steps.version.outputs.version }}"

      - name: Smoke test (headless)
        shell: bash
        run: |
          bin="desktop/bin/vukem-finances"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          bash desktop/scripts/smoke.sh "$bin"

      # Off until the repository variable MSIX_ENABLED is "true" (docs/desktop.md).
      # The MSIX checks need no secret. The package is signed with a throwaway
      # certificate that lives only in this job, so it installs here and nowhere
      # else: it goes to its own artifact, never into dist/ and never to the
      # release. The Store package is built in the `store` job.
      - name: MSIX (build)
        if: runner.os == 'Windows' && vars.MSIX_ENABLED == 'true'
        id: msix
        shell: bash
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wails3 task windows:msix VERSION="$VERSION"
          mkdir -p ../msix-out
          cp bin/*.msix ../msix-out/
          echo "path=$(cd ../msix-out && pwd -W)/$(ls ../msix-out | grep '\.msix$')" >> "$GITHUB_OUTPUT"

      - name: MSIX (sign with a throwaway certificate)
        if: runner.os == 'Windows' && vars.MSIX_ENABLED == 'true'
        shell: pwsh
        env:
          MSIX: ${{ steps.msix.outputs.path }}
        run: ./desktop/scripts/msix-ci.ps1 -Step Sign -Package $env:MSIX

      - name: MSIX (install, smoke test, uninstall)
        if: runner.os == 'Windows' && vars.MSIX_ENABLED == 'true'
        shell: pwsh
        env:
          MSIX: ${{ steps.msix.outputs.path }}
        run: ./desktop/scripts/msix-ci.ps1 -Step Smoke -Package $env:MSIX

      # Not a gate yet: whether the kit runs on a hosted runner was not proven
      # when this was written (docs/desktop.md). Make it blocking once it is.
      - name: MSIX (Windows App Certification Kit)
        if: runner.os == 'Windows' && vars.MSIX_ENABLED == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          MSIX: ${{ steps.msix.outputs.path }}
        run: ./desktop/scripts/msix-ci.ps1 -Step Cert -Package $env:MSIX -ReportDir msix-out

      - name: MSIX (remove the throwaway certificate)
        if: always() && runner.os == 'Windows' && vars.MSIX_ENABLED == 'true'
        shell: pwsh
        env:
          MSIX: ${{ steps.msix.outputs.path }}
        run: ./desktop/scripts/msix-ci.ps1 -Step Cleanup -Package $env:MSIX

      - name: MSIX (upload, test-signed, not for users)
        if: "!cancelled() && runner.os == 'Windows' && vars.MSIX_ENABLED == 'true'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-ci-test-signed
          path: msix-out/*
          if-no-files-found: error

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist
          cd desktop/bin
          case "$RUNNER_OS" in
            Windows) cp ./*-setup.exe ./*-portable.exe ../../dist/ ;;
            macOS) cp ./*-macos-*.zip ./*-macos-*.dmg ../../dist/ ;;
            Linux) cp ./*.deb ./*.AppImage ../../dist/ ;;
          esac
          ls -l ../../dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Upload to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true

      - name: Check that every installer is there
        run: |
          missing=0
          for pattern in '*-setup.exe' '*-portable.exe' '*-macos-*.dmg' '*-macos-*.zip' '*.deb' '*.AppImage'; do
            if ! compgen -G "dist/$pattern" > /dev/null; then
              echo "::error::no $pattern in the build artifacts"
              missing=1
            fi
          done
          ls -l dist
          exit "$missing"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --repo "$REPO" --clobber

  # Submits the exe that the Windows job built and smoke tested to the Microsoft
  # Store, as a new MSIX with the real identity of Partner Center. It runs only
  # for a published (not pre-release) release and only when the repository
  # variables MSIX_ENABLED and MSSTORE_ENABLED are "true"; otherwise the job is
  # skipped. The first submission of an app is manual (docs/desktop.md).
  store:
    name: Submit to the Microsoft Store
    if: github.event_name == 'release' && !github.event.release.prerelease && vars.MSIX_ENABLED == 'true' && vars.MSSTORE_ENABLED == 'true'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-Windows
          path: dist

      - name: Pack the Store MSIX, unsigned because the Store signs it
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          for name in IDENTITY_NAME PUBLISHER PUBLISHER_DISPLAY_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::the repository variable MSSTORE_$name is empty (copy it from Partner Center, Product identity)"
              exit 1
            fi
          done
          exe="$(ls dist/*-portable.exe)"
          mkdir -p store
          powershell -NoProfile -ExecutionPolicy Bypass -File desktop/build/windows/msix/build.ps1 \
            -Exe "$exe" -Out store/vukem-finances.msix -Version "${TAG#v}" \
            -IdentityName "$IDENTITY_NAME" -Publisher "$PUBLISHER" -PublisherDisplayName "$PUBLISHER_DISPLAY_NAME"

      - name: Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.4

      - name: Configure the CLI
        shell: bash
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          msstore reconfigure \
            --tenantId "$AZURE_AD_TENANT_ID" \
            --sellerId "$SELLER_ID" \
            --clientId "$AZURE_AD_APPLICATION_CLIENT_ID" \
            --clientSecret "$AZURE_AD_APPLICATION_SECRET"

      - name: Submit and wait for the certification
        shell: bash
        env:
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          if [ -z "$PRODUCT_ID" ]; then
            echo "::error::the repository variable MSSTORE_PRODUCT_ID is empty"
            exit 1
          fi
          msstore publish store/vukem-finances.msix --appId "$PRODUCT_ID"
          # Exits non-zero when the submission ends FAILED (rejected or commit failed).
          msstore submission poll "$PRODUCT_ID"
