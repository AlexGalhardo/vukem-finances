# git-cliff configuration: Conventional Commits -> Keep a Changelog 1.1.0.
# https://git-cliff.org/docs/configuration
#
# Print the section for the next release and paste it under the header of
# CHANGELOG.md, replacing "[Unreleased]":
#
#   git cliff --config .config/cliff.toml --offline --unreleased --tag vX.Y.Z --strip header
#
# Always pass --offline. With [remote.github] set, git-cliff otherwise calls
# the GitHub API for every run (and panics on an empty repository or without
# network); the template builds the commit links itself and needs none of it.
#
# CHANGELOG.md stays hand-editable that way, which Keep a Changelog expects:
# entries that no commit message explains still belong in it. `--output
# CHANGELOG.md` rewrites the whole file instead, and loses them.
#
# The [remote.github] section below names the repository; every entry links
# its commit to https://github.com/AlexGalhardo/vukem-finances/commit/<id>.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[remote.github]
owner = "AlexGalhardo"
repo = "vukem-finances"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+'
sort_commits = "oldest"
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { body = "(?i)security", group = "<!-- 5 -->Security" },
  { footer = "^Deprecated", group = "<!-- 2 -->Deprecated" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^(docs|test|ci|build|chore|style)", skip = true },
]
