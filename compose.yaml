# The local stack: the app on SQLite and a mail catcher.
#
#   docker compose up --build
#
# works on a fresh clone: the app is built from the same Dockerfile your
# platform builds, and it reads .env, where `vukem new` already wrote APP_KEY.
# Open http://localhost:3000 for the app and http://localhost:8025 for the
# mail catcher, which holds every email the app sends.
#
# The edition defaults to personal; run the saas edition with
#   APP_EDITION=saas docker compose up --build
# (it needs the STRIPE_* settings in .env). For a server, see compose.prod.yaml.
#
# https://vukem.dev/docs/deployment/docker-and-railway
name: vukem-finances

services:
  app:
    build: .
    # .env drives the app; the overrides below are the values that are only
    # true inside this network.
    env_file: [.env]
    environment:
      APP_URL: http://localhost:3000
      # A shell variable wins over .env, so the edition is chosen per run.
      APP_EDITION: ${APP_EDITION:-personal}
      MAIL_MAILER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # The catcher speaks plain SMTP on a private network, not STARTTLS.
      SMTP_INSECURE: "true"
      MAIL_FROM: vukem-finances <hello@localhost>
    # Ports bind to 127.0.0.1 so the app and mail catcher stay off the network; drop the prefix to expose one on purpose.
    ports: ["127.0.0.1:3000:3000"]
    # The SQLite file lives in this volume. One replica only: SQLite has one writer.
    volumes: ["storage:/app/storage"]
    # Apply the migrations, then hand the container to the server with exec,
    # so the app receives Compose's stop signal and shuts down gracefully.
    entrypoint: ["/bin/sh", "-c", "/app/app migrate && exec /app/app"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/up"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      mailpit:
        condition: service_started

  # Mailpit accepts every message and shows it in a web inbox, so password
  # resets and verification emails are readable without a mail provider.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    # Only the web inbox is published; SMTP stays on the private network.
    ports: ["127.0.0.1:8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  storage:
