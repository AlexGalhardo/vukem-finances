# golangci-lint v2, run in CI by the official action (a CI tool, not a project
# dependency). Real defects block: errcheck, govet, ineffassign, staticcheck
# SA checks, unused. Style-only and quick-fix suggestions are off: the tests
# keep hostile Unicode literals on purpose (ST1018), and selectors through an
# embedded field are how the framework types read (QF1008).
version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1018
        - -QF1001
        - -QF1002
        - -QF1008
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
